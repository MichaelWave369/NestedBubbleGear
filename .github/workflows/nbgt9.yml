name: NBG-T9 Portable Evidence Bundle Qualification

on:
  pull_request:
    paths:
      - "experiments/NBGT9/**"
      - "docs/TEMPORAL_NBG.md"
      - ".github/workflows/nbgt9.yml"
  push:
    branches: [ main ]
    paths:
      - "experiments/NBGT9/**"
      - "docs/TEMPORAL_NBG.md"
      - ".github/workflows/nbgt9.yml"
  workflow_dispatch:

jobs:
  qualify-nbgt9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print candidate hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            experiments/NBGT9/SPEC.md \
            experiments/NBGT9/src/nbgt9.py \
            experiments/NBGT9/tests/test_nbgt9.py

      - name: Run NBG-T9 bundle harness
        run: python experiments/NBGT9/src/nbgt9.py

      - name: Run NBG-T9 unit tests
        run: python -m unittest discover -s experiments/NBGT9/tests -v

      - name: Verify candidate witness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("experiments/NBGT9/results")
          result=json.loads((root/"result.json").read_text())
          assert result["verdict"]=="PASS_NBGT9"
          assert result["checks_passed"]==22
          assert result["checks_total"]==22
          assert result["witness"]["source_count"]==3
          assert result["witness"]["duplicate_cluster_count"]==1
          assert result["witness"]["drift_count"]==1
          assert result["witness"]["merged_decision_count"]==4
          assert result["witness"]["oppose_review_state"]=="REVIEW_CONFLICT"
          assert result["witness"]["claim_source_status"]=="ALLEGED"
          assert result["witness"]["claim_review_status"]=="CORROBORATED"
          assert result["witness"]["first_import_added"]==3
          assert result["witness"]["second_import_reused"]==3
          assert result["witness"]["import_trust_state"]=="REVIEW_REQUIRED"
          for name in (
              "result.json",
              "source_registry.json",
              "duplicate_clusters.json",
              "drift_history.json",
              "merged_bundle.json",
              "merged_claim_state.json",
          ):
              print(name, hashlib.sha256((root/name).read_bytes()).hexdigest())
          print("PASS_NBGT9_CANDIDATE")
          PY
