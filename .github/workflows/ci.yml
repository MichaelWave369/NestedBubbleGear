name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify AH9 frozen hashes
        run: |
          printf '%s  %s\n' \
            ac02ab547f6ea607e7998c99dfcb3b06f4e98da56b24b6fd71f48734851e9ca5 experiments/AH9/SPEC.md \
            7afce9d719769b11d36c5d3ccfd94f28cdfc6e91963202813835a29dfcbd5bee experiments/AH9/src/ah9.py \
            470f81bf5cd48b47a14d2895a1d4f64a9afb581373122795b1afdb6772e0002f experiments/AH9/tests/test_ah9.py \
            | sha256sum -c -
      - name: Run AH9 frozen harness
        run: python experiments/AH9/src/ah9.py
      - name: Run AH9 unit tests
        run: python -m unittest discover -s experiments/AH9/tests -v

      - name: Verify AH10 frozen hashes
        run: |
          printf '%s  %s\n' \
            abb90f3316d21845b4a55a94d3b9d48843bfb232d3802035bf17a9f92a76cd08 experiments/AH10/SPEC.md \
            34ecff77a6afbc6650c6fc121e912d301b3c789a3f3a008fb4ab6220005f6849 experiments/AH10/src/ah10.py \
            418fcb3569331542c7ae1dda8de520f9fcbaf0cb7dd1edd31b4c9cd316510bfb experiments/AH10/tests/test_ah10.py \
            | sha256sum -c -
      - name: Run AH10 frozen harness
        run: python experiments/AH10/src/ah10.py
      - name: Run AH10 unit tests
        run: python -m unittest discover -s experiments/AH10/tests -v

      - name: Verify AH11 frozen hashes
        run: |
          printf '%s  %s\n' \
            3a5cddb0a6b8d442a990b951727f6717dab4016f782f960310e61bf7553cff02 experiments/AH11/SPEC.md \
            67d3baef6e53505e0da03b04a0cd0092de657bee2c331be860e65b276ad8ecd1 experiments/AH11/src/ah11.py \
            0ad609e6766c88afc52a152c0f076f88e1c62cd2141a8f407b824af64872b0c4 experiments/AH11/tests/test_ah11.py \
            | sha256sum -c -
      - name: Run AH11 frozen harness
        run: python experiments/AH11/src/ah11.py
      - name: Run AH11 unit tests
        run: python -m unittest discover -s experiments/AH11/tests -v

      - name: Verify AH12 frozen hashes
        run: |
          printf '%s  %s\n' \
            d217e5506c77b7acaa85425384f24dddbc604874430b0991aa2759ff8542a2f0 experiments/AH12/SPEC.md \
            7fd7ff6228b2015dadd0dce239ad729a812b5ea2f43cc8e320c1fe5fa1517bd0 experiments/AH12/src/ah12.py \
            0b8ae1001fc86b5d6d2c544affa0c6dcd1ecab556f1fb0ca3bf8d00b88ae4dbe experiments/AH12/tests/test_ah12.py \
            | sha256sum -c -
      - name: Run AH12 frozen harness
        run: python experiments/AH12/src/ah12.py
      - name: Run AH12 unit tests
        run: python -m unittest discover -s experiments/AH12/tests -v

      - name: Verify AH13 frozen hashes
        run: |
          printf '%s  %s\n' \
            3bbb9619b8021a79c502290cff8103606f07096f5603f52446d59c45f00bc56d experiments/AH13/SPEC.md \
            f746ca9fb9a938036179dead91533eaa3ac4b49c9840231d0f7b053cdacf76f3 experiments/AH13/src/ah13.py \
            7011686b6a8fc3b5c11bd48c88a22ee145c42ad0c10ec7749952b6bb66fb71ac experiments/AH13/tests/test_ah13.py \
            | sha256sum -c -
      - name: Run AH13 frozen harness
        run: python experiments/AH13/src/ah13.py
      - name: Run AH13 unit tests
        run: python -m unittest discover -s experiments/AH13/tests -v

      - name: Verify AH14 frozen hashes
        run: |
          printf '%s  %s\n' \
            e72579d5ca95813dbbd125c8d87582e05749c51d8537a3aebab1083c045d5cf0 experiments/AH14/SPEC.md \
            fa655b6031ab1ebcb1f5aeb02ad8c58366541e7442599bdd0ddfe4b8dc91a405 experiments/AH14/src/ah14.py \
            3b023d0b1cc516f4fb63afc77095d3f5adde497c2186ddfca89db3aded5c6158 experiments/AH14/tests/test_ah14.py \
            | sha256sum -c -
      - name: Run AH14 frozen harness
        run: python experiments/AH14/src/ah14.py
      - name: Run AH14 unit tests
        run: python -m unittest discover -s experiments/AH14/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
