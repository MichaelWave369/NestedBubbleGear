name: AH41 Frozen Qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ah41:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify AH41 frozen hashes
        run: |
          printf '%s  %s\n' \
            8d50373df6d79a1b0c0f925c857b902200e1f19c94cce02916a8d2116e77815e experiments/AH41/SPEC.md \
            d0170543582b0d4fd983f8d2f5d3b5bc087551959b087da653d8e02cda7e90f2 experiments/AH41/src/ah41.py \
            e0d2d1f00e5990175d049ce2ce69c007cfdc799628c1521946fc86391b7a11da experiments/AH41/tests/test_ah41.py \
            | sha256sum -c -
      - name: Run AH41 frozen harness
        run: python experiments/AH41/src/ah41.py
      - name: Run AH41 unit tests
        run: python -m unittest discover -s experiments/AH41/tests -v
