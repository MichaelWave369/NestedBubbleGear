name: NBG-T7 External Evidence Adapter Qualification

on:
  pull_request:
    paths:
      - "experiments/NBGT7/**"
      - "docs/TEMPORAL_NBG.md"
      - ".github/workflows/nbgt7.yml"
  push:
    branches: [ main ]
    paths:
      - "experiments/NBGT7/**"
      - "docs/TEMPORAL_NBG.md"
      - ".github/workflows/nbgt7.yml"
  workflow_dispatch:

jobs:
  qualify-nbgt7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print candidate hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            experiments/NBGT7/SPEC.md \
            experiments/NBGT7/src/nbgt7.py \
            experiments/NBGT7/tests/test_nbgt7.py

      - name: Run NBG-T7 adapter harness
        run: python experiments/NBGT7/src/nbgt7.py

      - name: Run NBG-T7 unit tests
        run: python -m unittest discover -s experiments/NBGT7/tests -v

      - name: Verify candidate result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("experiments/NBGT7/results")
          result=json.loads((root/"result.json").read_text())
          assert result["verdict"]=="PASS_NBGT7"
          assert result["checks_passed"]==18
          assert result["checks_total"]==18
          assert result["witness"]["k5_status"]=="ALLEGED"
          assert result["witness"]["k6_status"]=="CORROBORATED"
          assert result["witness"]["k9_status"]=="DISPUTED"
          assert result["witness"]["drift_count"]==1
          for name in ("result.json","base_claim.json","capture_receipts.json","review_decisions.json","drift_report.json"):
              print(name, hashlib.sha256((root/name).read_bytes()).hexdigest())
          print("PASS_NBGT7_CANDIDATE")
          PY
