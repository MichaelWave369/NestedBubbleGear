name: NBG-T4 Frozen Qualification

on:
  pull_request:
    paths:
      - "experiments/NBGT4/**"
      - "docs/TEMPORAL_NBG.md"
      - ".github/workflows/nbgt4.yml"
  push:
    branches: [ main ]
    paths:
      - "experiments/NBGT4/**"
      - "docs/TEMPORAL_NBG.md"
      - ".github/workflows/nbgt4.yml"
  workflow_dispatch:

jobs:
  qualify-nbgt4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify NBG-T4 frozen hashes
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/NBGT4
          printf '%s  %s\n' \
            '2e3234c021a48cd02c47db2bc7f553b44783b1afd6f01d968439c982d31807d5' 'SPEC.md' \
            'b7563efb0442ef50e7849b0ddf8a8e6c6f6fc1ca355aedeb049ce2bf9ea5a601' 'src/nbgt4.py' \
            '9ab2302203aaac62fcfd547c3c7d0fea3b3f987f0d72e7b0baa63ab391b57640' 'tests/test_nbgt4.py' \
            | sha256sum -c -

      - name: Run NBG-T4 hostile ingest harness
        run: python experiments/NBGT4/src/nbgt4.py

      - name: Run NBG-T4 unit tests
        run: python -m unittest discover -s experiments/NBGT4/tests -v

      - name: Verify qualified NBG-T4 result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("experiments/NBGT4/results")
          result=json.loads((root/"result.json").read_text())
          assert result["verdict"]=="PASS_NBGT4"
          assert result["checks_passed"]==15
          assert result["checks_total"]==15
          assert result["witness"]["generic_arrow_relation"]=="ALLEGED_LINK"
          assert result["witness"]["timeline_relation"]=="OCCURRED_BEFORE"
          assert result["witness"]["timeline_causal_inference"]=="NONE"
          assert result["witness"]["ambiguous_record_ids"]==["R05"]
          assert result["witness"]["rejected_record_ids"]==["R06","R09"]
          assert result["witness"]["hypothesis_record_ids"]==["H01"]
          expected={
              "result.json":"2125572b6ff22578ad6fac2e47787b6f3a6d389c60c7664754233ec9ad64f151",
              "fixture.json":"b8f5e7ee6512c1c51600ebae64816418d8fd2b4d5b6710cb063aff1f41e88b80",
              "audit.json":"e5971adb4d9693ac561321d5ecf6389ff9d771a3731e8c24fd77640b6830eff5",
          }
          for name,want in expected.items():
              got=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert got==want,(name,got,want)
          print("PASS_NBGT4_QUALIFIED")
          PY
