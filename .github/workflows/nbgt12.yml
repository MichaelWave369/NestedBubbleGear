name: NBG-T12 Counterfactual Governance Qualification

on:
  pull_request:
    paths:
      - "experiments/NBGT12/**"
      - "src/counterfactualGovernance.js"
      - "scripts/test_counterfactual_governance.mjs"
      - "src/App.jsx"
      - "src/styles.css"
      - "package.json"
      - "docs/TEMPORAL_NBG.md"
      - ".github/workflows/nbgt12.yml"
  push:
    branches: [ main ]
    paths:
      - "experiments/NBGT12/**"
      - "src/counterfactualGovernance.js"
      - "scripts/test_counterfactual_governance.mjs"
      - "src/App.jsx"
      - "src/styles.css"
      - "package.json"
      - "docs/TEMPORAL_NBG.md"
      - ".github/workflows/nbgt12.yml"
  workflow_dispatch:

jobs:
  qualify-nbgt12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site dependencies
        run: npm install

      - name: Verify NBG-T12 frozen semantic hashes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '7cd92f20f7d33e8ac6b72caa39edbe15a4fa606de42cd08747f8dc4a4bdc7cc5' 'experiments/NBGT12/SPEC.md' \
            '72f9fe46004f6f2f56da2a44aa6f47e8e00ff95a7969331a171e94284e720450' 'experiments/NBGT12/src/nbgt12.py' \
            'db012ed5f16589773ebc8c07c60f6d2bf22f2b3bd7276c3dabc6d43624b67f6d' 'experiments/NBGT12/tests/test_nbgt12.py' \
            '84a7184f6615a570deb9efa2c9166041bfd7e77a39035e35b02175d29bcf449b' 'src/counterfactualGovernance.js' \
            'c317395b1dcd8e02ed885bd71c5c82eb15bb8cf3177680d93dd6f0ae2bdd0a10' 'scripts/test_counterfactual_governance.mjs' \
            | sha256sum -c -

      - name: Run NBG-T12 branch harness
        run: python experiments/NBGT12/src/nbgt12.py

      - name: Run NBG-T12 Python tests
        run: python -m unittest discover -s experiments/NBGT12/tests -v

      - name: Run browser counterfactual acceptance
        run: npm run test:counterfactual-governance

      - name: Build current research site
        run: npm run build

      - name: Verify frozen artifacts and UI wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("experiments/NBGT12/results")
          result=json.loads((root/"result.json").read_text())
          assert result["verdict"]=="PASS_NBGT12"
          assert result["checks_passed"]==32
          assert result["checks_total"]==32
          assert result["witness"]["observed_k10_policy"]=="NORMAL@2.0"
          assert result["witness"]["observed_k10_outcome"]=="ABSTAIN_CONFLICT"
          assert result["witness"]["remove_k10_policy"]=="EMERGENCY@1.0"
          assert result["witness"]["remove_k10_outcome"]=="REJECTED"
          assert result["witness"]["delay_k10_outcome"]=="REJECTED"
          assert result["witness"]["alter_k9_outcome"]=="REJECTED"
          assert result["witness"]["first_divergence_known"]==9
          assert result["witness"]["first_divergence_valid"]==9
          assert result["witness"]["altered_event_id"]=="EV_DEACTIVATE_EMERGENCY"
          expected={
              "result.json":"74d8125a277a0db6b040d0811f39996512ce168b6d86ec601f6cb44fc02402a8",
              "observed_policy_ledger.json":"62e0118590b40e26c07dcb9f64dc1930f5716281b5456ee16b83e45f5a05d170",
              "remove_fork_receipt.json":"ac7e01236063f7e89c9ae0c5ad03e51a80c3b0a38c759a92b305b48d15cade7e",
              "remove_branch.json":"0646d9fb753dd85d9bae7124e52012f94bf0a607bda76a2697294dd055b1afe9",
              "remove_divergence.json":"7ee351e5e78a57ea851563213bfa381291d160656b3660e9b9099f03d71a00e1",
              "counterfactual_bundle.json":"16735447f6aef61aac92d927661dca22dc011a4e5a65dc99e8a4ca48879c2b58",
              "observed_k10_receipt.json":"9d708007b8f2a5a3bf505a73eb43379c63138acfcb4cb1bfc5a9ad996d1e443c",
              "remove_k10_receipt.json":"a875cde5cd3de6f03131a24c00404a6b931a1bf20111c56844fed1ae38a9a882",
          }
          for name,want in expected.items():
              got=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert got==want,(name,got,want)
          PY
          grep -q 'NBG-T12 · COUNTERFACTUAL GOVERNANCE' src/App.jsx
          grep -q 'OBSERVED ≠ COUNTERFACTUAL' src/App.jsx
          grep -q 'PASS_NBGT12_COUNTERFACTUAL_GOVERNANCE' scripts/test_counterfactual_governance.mjs
          echo PASS_NBGT12_QUALIFIED
