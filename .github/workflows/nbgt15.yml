name: NBG-T15 Adaptive Keyhole Synthesis Qualification

on:
  pull_request:
    paths:
      - "experiments/NBGT15/**"
      - "src/adaptiveKeyholeSynthesis.js"
      - "scripts/test_adaptive_keyhole_synthesis.mjs"
      - "src/App.jsx"
      - "src/styles.css"
      - "package.json"
      - "docs/TEMPORAL_NBG.md"
      - ".github/workflows/nbgt15.yml"
  push:
    branches: [ main ]
    paths:
      - "experiments/NBGT15/**"
      - "src/adaptiveKeyholeSynthesis.js"
      - "scripts/test_adaptive_keyhole_synthesis.mjs"
      - "src/App.jsx"
      - "src/styles.css"
      - "package.json"
      - "docs/TEMPORAL_NBG.md"
      - ".github/workflows/nbgt15.yml"
  workflow_dispatch:

jobs:
  qualify-nbgt15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site dependencies
        run: npm install

      - name: Verify NBG-T15 frozen semantic hashes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'ff848dc8a5ad436e13eb14f9ea93fed3ab7941d2d0a0c4dfe74aac1ac840f269' 'experiments/NBGT15/SPEC.md' \
            'fd2b4a70bbf39e278b5584f2944316327e94fdef7ceead77a4d5d884b7349612' 'experiments/NBGT15/src/nbgt15.py' \
            '0fafe447c5d344e89898fc94ddd9214d8c5a6cf70ff56143c9d26ab32ee79b9e' 'experiments/NBGT15/tests/test_nbgt15.py' \
            '395cba700acc4f8527d09c3ece46df2f8764e62f8f387463812f8d85e0f9e950' 'src/adaptiveKeyholeSynthesis.js' \
            '7957890d5659c79f53657189f3d6d2b2a16fd84764e9a978e61fb3a94485f13a' 'scripts/test_adaptive_keyhole_synthesis.mjs' \
            | sha256sum -c -

      - name: Run NBG-T15 synthesis harness
        run: python experiments/NBGT15/src/nbgt15.py

      - name: Run NBG-T15 Python tests
        run: python -m unittest discover -s experiments/NBGT15/tests -v

      - name: Run browser observer-synthesis acceptance
        run: npm run test:adaptive-keyhole-synthesis

      - name: Build current research site
        run: npm run build

      - name: Verify frozen artifacts and UI wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("experiments/NBGT15/results")
          result=json.loads((root/"result.json").read_text())
          assert result["verdict"]=="PASS_NBGT15"
          assert result["checks_passed"]==42
          assert result["checks_total"]==42
          static=result["witness"]["static_joint_eight"]
          assert static["status"]=="PASS"
          assert static["minimal_cardinality"]==5
          assert static["total_observer_cost"]==85
          assert [row["keyhole_id"] for row in static["selected_keyholes"]]==[
              "k6_t6","k7_t7","k9_t9","k9_t10","k11_t11"
          ]
          policy=result["witness"]["restricted_policy_pair"]
          assert policy["status"]=="PASS"
          assert policy["minimal_cardinality"]==1
          assert [row["keyhole_id"] for row in policy["selected_keyholes"]]==["k6_t6"]
          assert result["witness"]["restricted_outcome_pair"]["status"]=="REFUSE_UNSEPARABLE"
          assert result["witness"]["full9_joint"]["status"]=="REFUSE_UNSEPARABLE"
          a8=result["witness"]["adaptive8_stats"]
          assert a8["resolved_leaf_count"]==8
          assert a8["unresolved_leaf_count"]==0
          assert a8["worst_case_depth"]==3
          assert a8["query_node_count"]==6
          assert a8["distinct_keyhole_count"]==6
          assert result["witness"]["adaptive8_root"]["keyhole_id"]=="k9_t9"
          a9=result["witness"]["adaptive9_stats"]
          assert a9["resolved_leaf_count"]==7
          assert a9["unresolved_leaf_count"]==1
          assert a9["worst_case_depth"]==3
          expected={
              "result.json":"063489729846349c15002256c6b7009454285a020f8c1c54fa035e9bb4163acc",
              "static_joint_eight.json":"a3fa290433bb02c4241598047a822e4e5588e4aaee900c78040b9c61fdc7a26b",
              "static_policy_pair.json":"cca9e9ac4a5077525bcbd47715d1119895ca79233ed494e17f855013fff48f95",
              "static_outcome_pair_refusal.json":"b09dda366d83798c7ab2c62606476c43e7e3b6b5eb2d810ee1a09ee4fd0c06d9",
              "static_full9_refusal.json":"d3927913697bc770a3028e70d8007d12d96912954a4c2def3c6573a54b0806db",
              "adaptive_joint_eight.json":"4d96455bac23b002da6a12a0da39932eb546b442a4129ee7020e97f802872690",
              "adaptive_full9.json":"7cd8399ce27045a5525aa6dcf1f639990e398516a40a099635a707f7c36c43cb",
              "observer_comparison.json":"0ba57b21a7be0e9a483dc111ff62c4c28359de9af281c0800ba66c32f93446db",
          }
          for name,want in expected.items():
              got=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert got==want,(name,got,want)
          PY
          grep -q 'NBG-T15 · ADAPTIVE KEYHOLE SYNTHESIS' src/App.jsx
          grep -q 'OBSERVER COST ≠ EPISTEMIC VALUE' src/App.jsx
          grep -q 'PASS_NBGT15_ADAPTIVE_KEYHOLE_SYNTHESIS' scripts/test_adaptive_keyhole_synthesis.mjs
          echo PASS_NBGT15_QUALIFIED
