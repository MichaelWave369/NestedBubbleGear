name: Epistemic Provenance Qualification

on:
  pull_request:
    paths:
      - 'src/epistemicProvenance.js'
      - 'src/epistemicTemporalView.js'
      - 'src/temporalKeyhole.js'
      - 'scripts/test_epistemic_provenance.mjs'
      - 'schemas/epistemic-memory.schema.json'
      - 'schemas/epistemic-transition-receipt.schema.json'
      - 'docs/EPISTEMIC_PROVENANCE.md'
      - 'package.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/epistemic-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Run complete browser/model test suite
        run: npm test

      - name: Build live research site
        run: npm run build

      - name: Install Python test dependency used by W1
        run: python -m pip install --disable-pip-version-check -r experiments/W1/requirements-execute.txt

      - name: Run every existing Python unit-test directory
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find experiments meta -type d -name tests | sort)
          echo "Python test directories: ${#dirs[@]}"
          for dir in "${dirs[@]}"; do
            echo "::group::${dir}"
            python -m unittest discover -s "${dir}" -v
            echo "::endgroup::"
          done
